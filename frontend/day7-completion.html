<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Day-7 Completion - Autonomous AI Workforce</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css" />
<link rel="stylesheet" href="vendor/bootstrap-icons/font/bootstrap-icons.min.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page="day7-completion">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <main class="main-content">
    <div class="topbar">
      <div class="d-flex align-items-start gap-2">
        <button class="btn btn-outline-soft mobile-toggle" id="mobileToggle"><i class="bi bi-list"></i></button>
        <div>
          <div class="page-title">Day-7 Completion</div>
          <div class="page-subtitle">Definition of Done - 14 required capabilities</div>
        </div>
      </div>
      <button class="btn btn-accent" onclick="openUpdateWorkModal()"><i class="bi bi-plus-lg me-1"></i>Update Work</button>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div class="panel-title mb-0">Overall Day-7 Readiness</div>
          <div class="fw-bold fs-5" id="dodPercent">-</div>
        </div>
        <div class="progress progress-lg mb-2">
          <div class="progress-bar bg-success" id="dodProgressBar" role="progressbar" style="width:0%;"></div>
        </div>
        <div class="small text-muted-soft" id="dodCounts">Loading...</div>
      </div>
    </div>

    <div id="dodList"><div class="loading-state">Loading Day-7 requirements...</div></div>
  </main>
</div>

<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/update-work.js"></script>
<script src="js/app.js"></script>
<script src="js/day7.js"></script>
</body>
</html>
