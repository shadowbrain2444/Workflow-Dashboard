<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Architecture - Autonomous AI Workforce</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css" />
<link rel="stylesheet" href="vendor/bootstrap-icons/font/bootstrap-icons.min.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page="architecture">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <main class="main-content">
    <div class="topbar">
      <div class="d-flex align-items-start gap-2">
        <button class="btn btn-outline-soft mobile-toggle" id="mobileToggle"><i class="bi bi-list"></i></button>
        <div>
          <div class="page-title">Architecture</div>
          <div class="page-subtitle">General pipeline and recovery loop - click any node for details</div>
        </div>
      </div>
      <button class="btn btn-accent" onclick="openUpdateWorkModal()"><i class="bi bi-plus-lg me-1"></i>Update Work</button>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <div class="panel-title"><i class="bi bi-diagram-3 me-2"></i>General Architecture</div>
        <div id="mainPipeline" class="loading-state">Loading pipeline...</div>
      </div>
    </div>

    <div class="card recovery-loop">
      <div class="card-body">
        <div class="panel-title"><i class="bi bi-arrow-repeat me-2"></i>Recovery Loop</div>
        <div id="recoveryPipeline" class="loading-state">Loading recovery loop...</div>
      </div>
    </div>
  </main>
</div>

<div class="modal fade" id="archNodeModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="archNodeTitle">Module</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="archNodeBody"></div>
    </div>
  </div>
</div>

<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/update-work.js"></script>
<script src="js/app.js"></script>
<script src="js/architecture.js"></script>
</body>
</html>
