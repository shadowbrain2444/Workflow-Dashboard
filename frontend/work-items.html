<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Work Items - Autonomous AI Workforce</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css" />
<link rel="stylesheet" href="vendor/bootstrap-icons/font/bootstrap-icons.min.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page="work-items">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <main class="main-content">
    <div class="topbar">
      <div class="d-flex align-items-start gap-2">
        <button class="btn btn-outline-soft mobile-toggle" id="mobileToggle"><i class="bi bi-list"></i></button>
        <div>
          <div class="page-title">Work Items</div>
          <div class="page-subtitle">Every logged unit of work across the 7-day build</div>
        </div>
      </div>
      <button class="btn btn-accent" onclick="openUpdateWorkModal()"><i class="bi bi-plus-lg me-1"></i>Update Work</button>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-md-3">
            <label class="form-label mb-1">Search</label>
            <input type="text" class="form-control form-control-sm" id="fSearch" placeholder="Search module, description..." autocomplete="off" />
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label mb-1">Developer</label>
            <select class="form-select form-select-sm" id="fDeveloper"><option value="">All</option></select>
          </div>
          <div class="col-6 col-md-1">
            <label class="form-label mb-1">Day</label>
            <select class="form-select form-select-sm" id="fDay"><option value="">All</option></select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label mb-1">Status</label>
            <select class="form-select form-select-sm" id="fStatus"><option value="">All</option></select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label mb-1">Module</label>
            <select class="form-select form-select-sm" id="fModule"><option value="">All</option></select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label mb-1">Verification</label>
            <select class="form-select form-select-sm" id="fVerification"><option value="">All</option></select>
          </div>
          <div class="col-6 col-md-2">
            <label class="form-label mb-1">Date</label>
            <input type="date" class="form-control form-control-sm" id="fDate" />
          </div>
          <div class="col-6 col-md-2 d-flex gap-2">
            <button class="btn btn-sm btn-outline-soft w-100" id="fReset">Reset</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div class="text-muted-soft small" id="resultCount">Loading...</div>
          <div class="d-flex align-items-center gap-2">
            <label class="small text-muted-soft mb-0">Sort</label>
            <select class="form-select form-select-sm" id="fSort" style="width:auto;">
              <option value="updated_at:desc">Recently updated</option>
              <option value="created_at:desc">Recently created</option>
              <option value="day:asc">Day (asc)</option>
              <option value="day:desc">Day (desc)</option>
              <option value="status:asc">Status</option>
            </select>
          </div>
        </div>
        <div class="table-responsive-wrapper">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>ID</th><th>Developer</th><th>Day</th><th>Date</th><th>Module</th>
                <th>Description</th><th>Status</th><th>API</th><th>Verification</th><th>Updated</th><th></th>
              </tr>
            </thead>
            <tbody id="workItemsBody">
              <tr><td colspan="11" class="loading-state">Loading work items...</td></tr>
            </tbody>
          </table>
        </div>
        <nav class="mt-3">
          <ul class="pagination pagination-sm justify-content-center mb-0" id="pagination"></ul>
        </nav>
      </div>
    </div>
  </main>
</div>

<!-- View Details Modal -->
<div class="modal fade" id="viewWorkItemModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-file-earmark-text me-2"></i>Work Item Details</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="viewWorkItemBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-soft" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-accent" id="viewWorkItemEditBtn">Edit</button>
      </div>
    </div>
  </div>
</div>

<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/update-work.js"></script>
<script src="js/app.js"></script>
<script src="js/work-items.js"></script>
</body>
</html>
