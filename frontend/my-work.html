<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Work - Autonomous AI Workforce</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css" />
<link rel="stylesheet" href="vendor/bootstrap-icons/font/bootstrap-icons.min.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body data-page="my-work">
<div class="app-shell">
  <div id="sidebar-root"></div>
  <main class="main-content">
    <div class="topbar">
      <div class="d-flex align-items-start gap-2">
        <button class="btn btn-outline-soft mobile-toggle" id="mobileToggle"><i class="bi bi-list"></i></button>
        <div>
          <div class="page-title" id="myWorkTitle">My Work</div>
          <div class="page-subtitle" id="myWorkSubtitle">Your progress and work log</div>
        </div>
      </div>
      <button class="btn btn-accent" id="myWorkUpdateBtn" onclick="openUpdateWorkModal()"><i class="bi bi-plus-lg me-1"></i>Update Work</button>
    </div>

    <div id="adminNotice" class="alert alert-info d-none" role="alert">
      <i class="bi bi-info-circle me-2"></i>Admin accounts don't own personal work items. Manage everyone's work from
      <a href="work-items.html" class="alert-link">Work Items</a>.
    </div>

    <div id="myWorkContent">
      <div class="row g-3 mb-2" id="myWorkKpiRow">
        <div class="col-6 col-md-4 col-xl-2"><div class="kpi-card skeleton" style="height:92px;"></div></div>
      </div>

      <div class="card mt-3">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div class="panel-title mb-0"><i class="bi bi-list-task me-2"></i>My Work Items</div>
            <div class="text-muted-soft small" id="myWorkCount">Loading...</div>
          </div>
          <div class="table-responsive-wrapper">
            <table class="table table-hover align-middle">
              <thead>
                <tr><th>ID</th><th>Day</th><th>Date</th><th>Module</th><th>Description</th><th>Status</th><th>Verification</th><th>Updated</th><th></th></tr>
              </thead>
              <tbody id="myWorkBody"><tr><td colspan="9" class="loading-state">Loading your work...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal fade" id="viewMyWorkModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-file-earmark-text me-2"></i>Work Item Details</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="viewMyWorkBody"></div>
    </div>
  </div>
</div>

<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/update-work.js"></script>
<script src="js/app.js"></script>
<script src="js/my-work.js"></script>
</body>
</html>
